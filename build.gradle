plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'binwatch'
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Embedded, pure-Java database for persistent first-seen history. Shipped inside the mod jar (jar-in-jar).
	implementation "com.h2database:h2:${project.h2_version}"
	include "com.h2database:h2:${project.h2_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// Live network tests are opt-in only: ./gradlew test -Dbinwatch.liveTest=true
	systemProperty 'binwatch.liveTest', System.getProperty('binwatch.liveTest', 'false')
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat 'full'
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	// The standalone console app ships in its own jar (standaloneJar below).
	exclude 'dev/binwatch/standalone/**'
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// Standalone console app (no Minecraft): the shared engine without the in-game client package, plus Gson and H2.
// Build with: ./gradlew standaloneJar  ->  build/libs/binwatch-standalone-<version>.jar
def standaloneLibs = configurations.runtimeClasspath.filter { it.name.startsWith('gson-') || it.name.startsWith('h2-') }
def archiveOps = services.get(ArchiveOperations)
tasks.register('standaloneJar', Jar) {
	group = 'build'
	description = 'Builds the standalone AH Flipper console app (runs without Minecraft).'
	archiveBaseName = 'binwatch-standalone'
	from(sourceSets.main.output) {
		exclude 'dev/binwatch/client/**'
		exclude 'fabric.mod.json'
	}
	from(standaloneLibs.elements.map { files -> files.collect { archiveOps.zipTree(it.asFile) } }) {
		exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF', '**/module-info.class'
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	manifest {
		attributes('Main-Class': 'dev.binwatch.standalone.StandaloneMain', 'Implementation-Version': project.version)
	}
}
tasks.named('assemble') { dependsOn 'standaloneJar' }
